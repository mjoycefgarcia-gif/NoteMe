<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Sign Up </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Rozha+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-side">
      <a class="logo" href="login.html">NoteMe<span>.</span></a>
      <h1> Notes that look as good as they work. </h1>
      <p> Digital transes and document templates for students, Download instantly, or get one designed around your theme and colors.  </p>
    </section>

    <div class="auth-forms">

      <section class="auth-card signup">
        <h2> Sign Up </h2>
        <p class="sub"> Make an account </p>
        <form>
          <div class="form-row">
            <div><label for="su-username"> Username </label><input type="text" id="su-username"></div>
            <div><label for="su-name"> Name </label><input type="text" id="su-name"></div>
          </div>
          <div class="form-row">
            <div><label for="su-age"> Age </label><input type="number" id="su-age"></div>
            <div><label for="su-email"> Email </label><input type="email" id="su-email"></div>
          </div>
          <label for="su-address"> Address </label>
          <textarea id="su-address" rows="2"></textarea>
          <label for="su-password"> Password </label>
          <input type="password" id="su-password">
          <div class="hint"> Must be more than 5 characters. </div>
          <a class="btn block" href="login.html"> Sign Up </a>
        </form>
        <p class="switch">May account na? <a href="login.html"> Log In </a></p>
      </section>

    </div>
  </main>
</body>
</html>
